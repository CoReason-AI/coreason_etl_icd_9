version: 2

models:
  - name: gold_icd9_clinical_index
    description: "The Gold analytical table for AI agent legacy medical note translation. Retains full Bronze lineage."
    columns:
      - name: coreason_id
        description: "UUIDv5 generated primary key for identity resolution."
        data_tests:
          - unique
          - not_null
      - name: formatted_icd9_code
        description: "The formatted decimal code generated by Postgres macro."
        data_tests:
          - not_null
      - name: long_description
        description: "The trimmed clinical text extracted from the raw data JSONB."
        data_tests:
          - not_null
      - name: raw_data
        description: "Pass-through of the raw JSON blob from Bronze for auditability."
        data_tests:
          - not_null

  - name: gold_icd9_to_10_crosswalk_stub
    description: "A placeholder crosswalk stub table to be joined with CMS GEMs. Retains full Bronze lineage."
    columns:
      - name: coreason_id
        description: "UUIDv5 generated primary key for identity resolution."
        data_tests:
          - unique
          - not_null
      - name: formatted_icd9_code
        description: "The formatted decimal code generated by Postgres macro."
        data_tests:
          - not_null
      - name: raw_data
        description: "Pass-through of the raw JSON blob from Bronze for auditability."
        data_tests:
          - not_null
