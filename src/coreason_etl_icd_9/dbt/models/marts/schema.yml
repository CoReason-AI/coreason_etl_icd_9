version: 2

models:
  - name: gold_icd9_clinical_index
    description: >
      AGENT INSTRUCTION: Analytics-ready index of formatted codes and descriptions.
      Ready for vectorization and clinical NLP translation.
    columns:
      - name: formatted_icd9_code
        tests:
          - not_null
          - unique
      - name: long_description
        tests:
          - not_null

  - name: gold_icd9_to_10_crosswalk_stub
    description: >
      AGENT INSTRUCTION: Placeholder model designed to be joined later with the official
      CMS GEMs (General Equivalence Mappings) dataset.
    columns:
      - name: formatted_icd9_code
        tests:
          - not_null
      - name: target_icd10_code
      - name: map_type_flag
