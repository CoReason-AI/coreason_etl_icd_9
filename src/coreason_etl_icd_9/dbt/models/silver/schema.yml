version: 2

models:
  - name: silver_icd9_ontology
    description: "The cleaned, formatted Silver analytical layer for the ICD-9 CMS ontology."
    columns:
      - name: coreason_id
        description: "UUIDv5 generated primary key for identity resolution."
        data_tests:
          - unique
          - not_null
      - name: formatted_icd9_code
        description: "The formatted decimal code generated by Postgres macro."
        data_tests:
          - not_null
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - formatted_icd9_code
                - domain_type
      - name: long_description
        description: "The trimmed clinical text extracted from the raw data JSONB."
        data_tests:
          - not_null
      - name: raw_data
        description: "Pass-through of the raw JSON blob from Bronze."
        data_tests:
          - not_null
      - name: ingestion_ts
        description: "Pass-through of the ingestion time from Bronze."
        data_tests:
          - not_null
      - name: code_type
        description: "Pass-through of the original domain string."
        data_tests:
          - not_null
