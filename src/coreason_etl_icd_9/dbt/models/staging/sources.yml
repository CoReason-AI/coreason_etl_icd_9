version: 2

sources:
  - name: bronze
    schema: bronze
    description: >
      AGENT INSTRUCTION: This source represents the raw data ingested by dlt
      from the CMS ICD-9 master ZIP file. It is the raw entry point of the pipeline.
    tables:
      - name: icd9_cm_raw
        description: >
          Raw fixed-width parsed lines containing the unformatted code and long description,
          stored in a flexible JSONB column.
        columns:
          - name: code_type
            description: "Categorical string flag: 'Diagnosis' or 'Procedure'."
            tests:
              - not_null
              - accepted_values:
                  values: ['Diagnosis', 'Procedure']
          - name: raw_data
            description: >
              JSONB field containing the raw dictionary with 'raw_code' and 'raw_description'.
            tests:
              - not_null
          - name: _dlt_load_id
            description: "Internal ingestion run ID provided by dlt."
          - name: _dlt_id
            description: "Internal unique row identifier provided by dlt."
