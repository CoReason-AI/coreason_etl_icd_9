# AGENT INSTRUCTION: This configuration file strictly uses PG* environment variables
# for Postgres connection. It is explicitly designed for a seamless handoff
# between the ingestion and transformation layers.

coreason_etl_icd9:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', 'postgres') }}"
      dbname: "{{ env_var('PGDATABASE', 'coreason') }}"
      schema: silver
      threads: 4
      keepalives_idle: 0
    prod:
      type: postgres
      host: "{{ env_var('PGHOST') }}"
      port: "{{ env_var('PGPORT', '5432') | as_number }}"
      user: "{{ env_var('PGUSER') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE') }}"
      schema: silver
      threads: 8
      keepalives_idle: 0
